<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก — WorkFlow</title>

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../login/login.css" />
</head>
<body>
  <a href="../index.html" class="back-home">‹ หน้าหลัก</a>

  <main class="main-content">
    <div class="logo">WorkFlow</div>

    <section class="card">
      <h1>สมัครสมาชิก</h1>

      <p style="font-size:14px;color:#777;margin-bottom:20px;">
        สร้างบัญชีใหม่เพื่อเริ่มใช้งาน
      </p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">ชื่อ</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="ชื่อ-นามสกุล"
            autocomplete="name"
          />
        </div>

        <div class="field">
          <label for="email">อีเมล</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="อย่างน้อย 6 ตัวอักษร"
            autocomplete="new-password"
          />
        </div>

        <div class="field">
          <label for="confirm">ยืนยันรหัสผ่าน</label>
          <input
            id="confirm"
            name="confirm"
            type="password"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="login-btn">
          สมัครสมาชิก
        </button>
      </form>

      <p class="signup">
        มีบัญชีอยู่แล้ว?
        <a href="../login/login.html">เข้าสู่ระบบ</a>
      </p>
    </section>
  </main>

  <script src="./register.js"></script>
</body>
</html>
