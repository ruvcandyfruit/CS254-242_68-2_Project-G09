<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="courses.css">
</head>

<body>
    <div class="main-content">
        <div class="courses-header">
            <h1>รายวิชาของฉัน</h1>
            <button class="add-course-btn">
                <img src="../assets/icons/add.svg"> เพิ่มรายวิชา
            </button>
        </div>

        <div class="courses-list">
            <div class="course-card">
                <div class="course-card-top">
                    <div class="course-avatar">CS</div>
                    <div class="course-card-top-right">
                        <div class="course-menu">
                            <button class="course-menu-btn">
                                <img src="../assets/icons/ellipsis.svg">
                            </button>
                            <div class="course-dropdown">
                                <button data-action="edit">
                                    <img src="../assets/icons/edit.svg"> แก้ไขรายวิชา
                                </button>
                                <button class="danger" data-action="delete">
                                    <img src="../assets/icons/trash.svg"> ลบรายวิชา
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="course-info">
                    <div class="code-credit">
                        <span class="course-code">CS361</span>
                        <span class="course-credits">3 หน่วยกิต</span>
                    </div>
                    <h2 class="course-name">Software Engineering</h2>
                </div>
                <span class="course-divider"></span>
                <div class="course-footer">
                    <span class="course-alltasks">งานเสร็จแล้ว 30%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- การ์ดเพิ่มรายวิชา -->
    <form class="box-overlay" id="addCourseBox">
        <div class="box">
            <div class="box-header">
                <h2>เพิ่มวิชาเรียน</h2>
                <button type="button" class="box-close" id="addCourseClose">
                    <img src="../assets/icons/close.svg">
                </button>
            </div>
            <div class="box-body">
                <div class="box-row">
                    <div class="box-field">
                        <label>รหัสวิชา</label>
                        <input type="text" id="input-code" placeholder="CS261" required>
                    </div>
                    <div class="box-field">
                        <label>หน่วยกิต</label>
                        <input type="number" id="input-credits" step="0.5" placeholder="3" min="1" required>
                    </div>
                </div>
                <div class="box-field">
                    <label>ชื่อวิชา</label>
                    <input type="text" id="input-name" placeholder="Software Engineering" required>
                </div>
            </div>
            <div class="box-footer">
                <button type="button" class="btn-cancel" id="addCourseCancel">ยกเลิก</button>
                <button type="submit" class="btn-save">บันทึก</button>
            </div>
        </div>
    </form>

    <!-- การ์ดแก้ไขรายวิชา -->
    <form class="box-overlay" id="editCourseBox">
        <div class="box">
            <div class="box-header">
                <h2>แก้ไขรายวิชา</h2>
                <button type="button" class="box-close" id="editCourseClose">
                    <img src="../assets/icons/close.svg">
                </button>
            </div>
            <div class="box-body">
                <div class="box-row">
                    <div class="box-field">
                        <label>รหัสวิชา</label>
                        <input type="text" id="edit-code" placeholder="CS261" required>
                    </div>
                    <div class="box-field">
                        <label>หน่วยกิต</label>
                        <input type="number" id="edit-credits" step="0.5" placeholder="3" min="1" required>
                    </div>
                </div>
                <div class="box-field">
                    <label>ชื่อวิชา</label>
                    <input type="text" id="edit-name" placeholder="Software Engineering" required>
                </div>
            </div>
            <div class="box-footer">
                <button type="button" class="btn-cancel" id="editCourseCancel">ยกเลิก</button>
                <button type="submit" class="btn-save">บันทึก</button>
            </div>
        </div>
    </form>

    <!--sweet alert submit success-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="courses.js"></script>
</body>

</html>
