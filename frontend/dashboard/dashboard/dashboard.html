<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ภาพรวม — WorkFlow</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../components/sidebar/sidebar.css" />
  <link rel="stylesheet" href="../components/appShell/appShell.css" />
  <link rel="stylesheet" href="../components/taskItem/taskItem.css" />
  <link rel="stylesheet" href="../components/urgentBanner/urgentBanner.css" />
  <link rel="stylesheet" href="../components/workloadChart/workloadChart.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div id="app"></div>

  <!-- page template injected after appShell mounts -->
  <template id="dashboard-tpl">
    <div class="dash-header">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight" data-greeting>สวัสดี 👋</h1>
        <p class="text-muted-foreground mt-1">นี่คือภาพรวม workload ของคุณในสัปดาห์นี้</p>
      </div>
      <button class="btn btn-primary" id="open-add-task">
        <i data-lucide="plus"></i> เพิ่มงาน
      </button>
    </div>

    <div data-urgent-slot></div>

    <div class="stats-grid">
      <div class="card stat-card">
        <div class="stat-icon" style="background:hsl(var(--primary-soft));color:hsl(var(--primary));"><i data-lucide="list-checks"></i></div>
        <div class="stat-value" data-stat-active>0</div>
        <div class="stat-label">งานที่ค้าง</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:hsl(var(--accent));color:hsl(var(--accent-foreground));"><i data-lucide="clock"></i></div>
        <div class="stat-value" data-stat-hours>0 ชม.</div>
        <div class="stat-label">ชั่วโมงรวม</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:hsl(var(--destructive) / .1);color:hsl(var(--destructive));"><i data-lucide="flame"></i></div>
        <div class="stat-value" data-stat-urgent>0</div>
        <div class="stat-label">ด่วน (≤2 วัน)</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:hsl(var(--success) / .1);color:hsl(var(--success));"><i data-lucide="check-circle-2"></i></div>
        <div class="stat-value" data-stat-done>0</div>
        <div class="stat-label">ทำเสร็จแล้ว</div>
      </div>
    </div>

    <div class="grid lg:grid-cols-5 gap-6">
      <div class="card chart-card">
        <div class="flex items-baseline justify-between mb-4">
          <div>
            <h2 class="font-semibold">Workload รายสัปดาห์</h2>
            <p class="text-xs text-muted-foreground mt-0.5">ชั่วโมงงานต่อสัปดาห์ (6 สัปดาห์ข้างหน้า)</p>
          </div>
        </div>
        <div data-chart-slot></div>
        <div class="chart-legend">
          <span><span class="lg-sw" style="background:hsl(var(--primary));"></span> ปกติ</span>
          <span><span class="lg-sw" style="background:hsl(var(--warning));"></span> หนัก</span>
          <span><span class="lg-sw" style="background:hsl(var(--destructive));"></span> หนักมาก</span>
        </div>
      </div>

      <div class="card priority-card">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="font-semibold">ลำดับความสำคัญ</h2>
            <p class="text-xs text-muted-foreground mt-0.5">งานที่ควรทำก่อน</p>
          </div>
          <a class="btn btn-ghost btn-sm" href="../allTasks/allTasks.html">ดูทั้งหมด</a>
        </div>
        <div data-priority-list style="display:flex;flex-direction:column;gap:.625rem;"></div>
      </div>
    </div>
  </template>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
