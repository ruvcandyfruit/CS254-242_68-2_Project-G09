<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="login.css" />
</head>

<body>
    <a href="../index.html" class="back-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m15 18l-6-6l6-6" />
        </svg>
        หน้าหลัก
    </a>

    <div class="main-content">
        <div class="logo">
            <span>Workflow</span>
        </div>

        <div class="card">
            <h1>ยินดีต้อนรับ</h1>

            <form id="login-form" novalidate>
                <div class="field">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="กรอกอีเมลของคุณ" autocomplete="email"
                        required />
                    <span class="field-error" id="email-error"></span>
                </div>

                <div class="field">
                    <label for="password">รหัสผ่าน</label>

                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่านอย่างน้อย 8 ตัว"
                            autocomplete="current-password" required />

                        <button type="button" class="eye-btn" id="eye-btn" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2">
                                    <path
                                        d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575a1 1 0 0 1 0 .696a10.8 10.8 0 0 1-1.444 2.49m-6.41-.679a3 3 0 0 1-4.242-4.242" />
                                    <path
                                        d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151a1 1 0 0 1 0-.696a10.75 10.75 0 0 1 4.446-5.143M2 2l20 20" />
                                </g>
                            </svg>
                        </button>
                    </div>

                    <span class="field-error" id="password-error"></span>
                </div>


                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember" />
                        จดจำฉัน
                    </label>
                    <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="login-btn" id="login-btn">ลงชื่อเข้าใช้</button>

            </form>

            <p class="signup">ยังไม่มีบัญชี? <a href="../register/register.html">สมัครสมาชิก</a></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
