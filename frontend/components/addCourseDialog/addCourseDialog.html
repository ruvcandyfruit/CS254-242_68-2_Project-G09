<div data-dialog="addCourse" hidden>
  <div class="dialog-title">เพิ่มวิชาเรียน</div>
  <form data-add-course-form style="display:flex;flex-direction:column;gap:1rem;">
    <div class="grid sm:grid-cols-2 gap-3">
      <div style="display:flex;flex-direction:column;gap:.375rem;">
        <label class="label" for="acd-code">รหัสวิชา</label>
        <input id="acd-code" name="code" class="input" placeholder="CS361" />
      </div>
      <div style="display:flex;flex-direction:column;gap:.375rem;">
        <label class="label" for="acd-weight">หน่วยกิต</label>
        <input id="acd-weight" name="weight" type="number" min="1" max="6" value="3" class="input" />
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:.375rem;">
      <label class="label" for="acd-name">ชื่อวิชา</label>
      <input id="acd-name" name="name" class="input" placeholder="Software Engineering" />
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn btn-ghost" data-dialog-close>ยกเลิก</button>
      <button type="submit" class="btn btn-primary">บันทึก</button>
    </div>
  </form>
</div>
